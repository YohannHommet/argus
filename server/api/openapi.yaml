            $ref: "#/components/schemas/SeriesPoint"
        other:
          $ref: "#/components/schemas/SeriesOther"

    BreakdownRow:
      type: object
      required: [key, value, share]
      properties:
        key:
          type: string
          description: Raw dimension value (tool/model name, or an unconstrained vocabulary like decision_source/query_source).
        value: { type: number }
        share: { type: number }

    Breakdown:
      type: object
      required: [dimension, rows]
      properties:
        dimension:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/BreakdownRow"

    DecisionMatrixRow:
      type: object
      required: [tool_name, accept, reject, by_source, exact_share, p50_wait_ms, p95_wait_ms]
      properties:
        tool_name: { type: string }
        accept: { type: integer, format: int64 }
        reject: { type: integer, format: int64 }
        by_source:
          type: object
          description: Keys are raw decision_source values, unconstrained (SPEC §1.9).
          additionalProperties:
            type: integer
            format: int64
        exact_share: { type: number }
        p50_wait_ms: { type: [integer, "null"], format: int64 }
        p95_wait_ms: { type: [integer, "null"], format: int64 }

    DecisionMatrix:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/DecisionMatrixRow"

    Facets:
      type: object
      required: [projects, models, vendors, tools, decision_sources, query_sources]
      properties:
        projects: { type: array, items: { type: string } }
        models: { type: array, items: { type: string } }
        vendors: { type: array, items: { type: string } }
        tools: { type: array, items: { type: string } }
        decision_sources: { type: array, items: { type: string } }
        query_sources: { type: array, items: { type: string } }

    DataQuality:
      type: object
      required: [logs_exporter_seen, metrics_exporter_seen, hooks_seen, tool_details_seen]
      properties:
        logs_exporter_seen: { type: boolean }
        metrics_exporter_seen: { type: boolean }
        hooks_seen: { type: boolean }
        tool_details_seen: { type: boolean }

    Meta:
      type: object
      description: >-
        SPEC §4.3 full shape. The live handler (server/internal/httpapi/meta.go)
        currently returns only {version, commit, retention_days} — P3-08
        extends it to this full contract.
      required:
        [version, commit, retention_days, feature_flags, vendors, logs_exporter_seen,
          metrics_exporter_seen, hooks_seen, tool_details_seen, estimated_cost_present, data_quality]
      properties:
        version: { type: string }
        commit: { type: string }
        retention_days: { type: integer }
        feature_flags:
          type: object
          additionalProperties:
            type: boolean
        vendors:
          type: array
          items:
            type: string
        logs_exporter_seen: { type: boolean }
        metrics_exporter_seen: { type: boolean }
        hooks_seen: { type: boolean }
        tool_details_seen: { type: boolean }
        estimated_cost_present: { type: boolean }
        data_quality:
          $ref: "#/components/schemas/DataQuality"

    UnknownKindGroup:
      type: object
      required: [event_name, source, count, first_seen, last_seen, sample]
      properties:
        event_name: { type: string }
        source:
          $ref: "#/components/schemas/EventSource"
        count: { type: integer, format: int64 }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        sample:
          type: object
          additionalProperties: true

    QualityUnknownKindsResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/UnknownKindGroup"

    HookLatencyRow:
      type: object
      required: [hook_event, executions, p50_ms, p95_ms, p99_ms, errors, cancelled]
      properties:
        hook_event: { type: string }
        executions: { type: integer, format: int64 }
        p50_ms: { type: integer, format: int64 }
        p95_ms: { type: integer, format: int64 }
        p99_ms: { type: integer, format: int64 }
        errors: { type: integer, format: int64 }
        cancelled: { type: integer, format: int64 }

    QualityHookLatencyResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/HookLatencyRow"

    StreamEventFrame:
      allOf:
        - $ref: "#/components/schemas/TimelineEvent"
      description: "event: event — a persisted event, slim shape (SPEC §5.1). Carries `id:` (the event_ref) on the SSE frame."

    StreamSessionFrame:
      type: object
      description: "event: session — debounced (500ms/session) projection snapshot (SPEC §5.1). No `id:` line."
      required: [id, status, turn_count, cost]
      properties:
        id: { type: string }
        status:
          $ref: "#/components/schemas/SessionStatus"
        turn_count: { type: integer }
        cost:
          $ref: "#/components/schemas/SessionCost"

    StreamStatsFrame:
      type: object
      description: "event: stats — pipeline health, every 2s (SPEC §5.1). No `id:` line."
      required: [events_per_sec, active_sessions, queue_depth, ingest_lag_ms, dropped_total]
      properties:
        events_per_sec: { type: number }
        active_sessions: { type: integer }
        queue_depth: { type: integer }
        ingest_lag_ms: { type: integer }
        dropped_total: { type: integer }

    StreamLagFrame:
      type: object
      description: "event: lag — a subscriber's buffer overflowed (SPEC §5.1). No `id:` line."
      required: [dropped]
      properties:
        dropped: { type: integer }

    StreamResetFrame:
      type: object
      description: "event: reset — the requested replay position predates the window (SPEC §5.1, §5.2). No `id:` line."
      required: [reason, from]
      properties:
        reason:
          type: string
          enum: [replay_window_exceeded]
        from: { type: string, format: date-time }

    StreamShutdownFrame:
      type: object
      description: "event: shutdown — sent once on graceful shutdown so the browser reconnects instead of erroring (SPEC §5.1). No payload fields; body is an empty JSON object."
      properties: {}
      additionalProperties: false

    StreamEvent:
      description: >-
        The union of SSE frame payload shapes (SPEC §5.1). The frame *type*
        is carried by the SSE `event:` line, not a discriminator field in
        the JSON body — a client picks the right member by the frame's
        event name.
      oneOf:
        - $ref: "#/components/schemas/StreamEventFrame"
        - $ref: "#/components/schemas/StreamSessionFrame"
        - $ref: "#/components/schemas/StreamStatsFrame"
        - $ref: "#/components/schemas/StreamLagFrame"
        - $ref: "#/components/schemas/StreamResetFrame"
        - $ref: "#/components/schemas/StreamShutdownFrame"
