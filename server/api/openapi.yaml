openapi: 3.1.0

info:
  title: Argus API
  version: "1.0.0"
  description: >-
    Argus's read API (docs/SPEC.md §4): agent-telemetry sessions, timelines,
    events, tool calls, subagent trees, and rollup-backed analytics, plus the
    ops endpoints and the ingest surface (OTLP + the hooks webhook). This
    file is hand-authored and reviewed like code (§4.4): it is the contract
    handlers must satisfy, not a byproduct of them.

    Every vendor-supplied field (project, model, vendor, decision_source,
    query_source, tool_source, permission_mode, start_type, terminal_type,
    and friends) is typed `string` with no `enum`, on purpose (SPEC §0,
    §4.4): Argus ingests values it has never seen and must never reject or
    mistype them. Only Argus's own four closed taxonomies — `kind`,
    `source`, `correlation`, `status` (SPEC §0) — and Argus-invented request
    parameters (sort keys, dimensions, buckets) are enumerated.

servers:
  - url: /
    description: Argus serves the ops, read, and ingest surfaces from one origin.

tags:
  - name: ops
    description: Liveness/readiness/metrics (SPEC §3.8).
  - name: sessions
    description: Session list, detail, timeline, turns, tool calls, subagents, stream.
  - name: events
    description: Cross-session event search and single-event lookup.
  - name: tool-calls
    description: Cross-session tool-call list — the decision-provenance drill-down.
  - name: analytics
    description: Rollup-backed fleet KPIs (SPEC §2.4, §4.3).
  - name: quality
    description: Data-quality introspection (unmapped event names, hook latency).
  - name: meta
    description: Version, retention, vendors seen, data-quality summary, filter facets.
  - name: stream
    description: Server-Sent Events (SPEC §5).
  - name: ingest
    description: OTLP receivers and the hooks webhook (SPEC §3.4, §3.5).

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [ops]
      summary: Liveness probe
      description: No DB, no readiness check (SPEC §3.8) — always cheap and correct.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OKStatus"
              examples:
                ok:
                  value: { status: "ok" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /readyz:
    get:
      operationId: readyz
      tags: [ops]
      summary: Readiness probe
      description: >-
        DB ping + migrations current + queue not saturated (SPEC §3.8).
        Fails during the graceful-shutdown drain sequence.
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
              examples:
                ready:
                  value: { status: "ok", migrations: "current" }
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: Not ready (draining, DB unreachable, migrations pending, or queue saturated).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notReady:
                  value:
                    type: "urn:argus:error:not-ready"
                    title: "Service Unavailable"
                    status: 503
                    detail: "database health check failed: dial tcp: connection refused"
                    instance: "/readyz"

  /metrics:
    get:
      operationId: metrics
      tags: [ops]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
              examples:
                sample:
                  value: |
                    # HELP argus_ingest_events_total Total events ingested
                    # TYPE argus_ingest_events_total counter
                    argus_ingest_events_total 48213
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/meta:
    get:
      operationId: getMeta
      tags: [meta]
      summary: Version, retention, vendors seen, data-quality summary
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Meta"
              examples:
                default:
                  value:
                    version: "1.4.0"
                    commit: "a1b2c3d"
                    retention_days: 90
                    feature_flags: {}
                    vendors: ["claude_code", "codex"]
                    logs_exporter_seen: true
                    metrics_exporter_seen: true
                    hooks_seen: true
                    tool_details_seen: false
                    estimated_cost_present: false
                    data_quality:
                      logs_exporter_seen: true
                      metrics_exporter_seen: true
                      hooks_seen: true
                      tool_details_seen: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/facets:
    get:
      operationId: getFacets
      tags: [meta]
      summary: Filter option lists for the session/event/tool-call UIs
      responses:
        "200":
          description: Distinct raw values seen so far, per filterable dimension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facets"
              examples:
                default:
                  value:
                    projects: ["argus", "platform"]
                    models: ["claude-opus-5", "claude-sonnet-4-5"]
                    vendors: ["claude_code", "codex"]
                    tools: ["Edit", "Read", "Bash"]
                    decision_sources: ["config", "hook", "user_permanent", "user_temporary", "user_reject", "user_abort"]
                    query_sources: ["", "sdk", "generate_session_title"]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List sessions
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Vendor"
        - $ref: "#/components/parameters/Model"
        - name: status
          in: query
          description: Repeated params OR (SPEC §4.1).
          schema:
            type: array
            items:
              $ref: "#/components/schemas/SessionStatus"
          style: form
          explode: true
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/DecisionSource"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: q
          in: query
          description: Substring match on id/project/cwd.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_event_at, started_at, cost_usd, event_count]
            default: last_event_at
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionsListResponse"
              examples:
                default:
                  value:
                    data:
                      - id: "3f7a3b1e-0000-0000-0000-000000000001"
                        vendor: "claude_code"
                        project: "argus"
                        cwd: "/home/y/Labs/argus"
                        status: "active"
                        start_type: "fresh"
                        started_at: "2026-08-11T09:02:11.412Z"
                        ended_at: null
                        last_event_at: "2026-08-11T09:31:44.900Z"
                        duration_ms: 1773488
                        turn_count: 12
                        event_count: 480
                        tool_call_count: 96
                        tool_reject_count: 3
                        subagent_count: 2
                        error_count: 1
                        tokens: { input: 41233, output: 18944, cache_read: 1204331, cache_creation: 88210 }
                        cost:
                          usd: 4.2711
                          reported_usd: 4.2711
                          estimated_usd: 0
                          estimated_share: 0
                          by_query_source: { "": 3.9011, "sdk": 0.35, "generate_session_title": 0.02 }
                          dominant_query_source: ""
                          other_query_source_usd: 0.37
                        models: ["claude-opus-5", "claude-sonnet-4-5"]
                        partial: false
                        app_version: "2.1.220"
                        entrypoint: "cli"
                        terminal_type: "wsl-Ubuntu"
                    page: { next_cursor: "eyJrIjoi4oCm", has_more: true }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Session detail with aggregates
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The session, plus permission history, top tools, and decision summary.
          headers:
            ETag:
              description: Hash of the underlying max(ts, seq) + filter (SPEC §4.1).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
              examples:
                default:
                  value:
                    id: "3f7a3b1e-0000-0000-0000-000000000001"
                    vendor: "claude_code"
                    project: "argus"
                    cwd: "/home/y/Labs/argus"
                    status: "active"
                    start_type: "fresh"
                    started_at: "2026-08-11T09:02:11.412Z"
                    ended_at: null
                    last_event_at: "2026-08-11T09:31:44.900Z"
                    duration_ms: 1773488
                    turn_count: 12
                    event_count: 480
                    tool_call_count: 96
                    tool_reject_count: 3
                    subagent_count: 2
                    error_count: 1
                    tokens: { input: 41233, output: 18944, cache_read: 1204331, cache_creation: 88210 }
                    cost:
                      usd: 4.2711
                      reported_usd: 4.2711
                      estimated_usd: 0
                      estimated_share: 0
                      by_query_source: { "": 3.9011, "sdk": 0.35 }
                      dominant_query_source: ""
                      other_query_source_usd: 0.35
                    models: ["claude-opus-5"]
                    partial: false
                    app_version: "2.1.220"
                    entrypoint: "cli"
                    terminal_type: "wsl-Ubuntu"
                    permission_mode_history:
                      - ts: "2026-08-11T09:05:00.000Z"
                        from: "default"
                        to: "acceptEdits"
                        trigger: "user"
                    top_tools:
                      - { tool_name: "Edit", calls: 40, rejects: 2, p50_ms: 120 }
                    decision_summary:
                      accept: 90
                      reject: 6
                      by_source: { config: 60, hook: 10, user_permanent: 10, user_temporary: 5, user_reject: 4, user_abort: 1 }
                      exact_share: 1.0
                    sources_seen: ["otel_log", "hook"]
                    raw_events_expired: false
                    hook_latency: { p50_ms: 9, p95_ms: 41, by_hook_event: { PostToolUse: 9 } }
                    first_seen_at: "2026-08-11T09:02:10.000Z"
                    user: "yohann"
                    organization_id: "org_1"
        "304":
          description: Not modified — the client's If-None-Match matches the current ETag.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions/{id}/timeline:
    get:
      operationId: getSessionTimeline
      tags: [sessions]
      summary: Raw events of one session, keyset-paginated
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Kinds"
        - $ref: "#/components/parameters/PromptID"
        - $ref: "#/components/parameters/AgentID"
        - $ref: "#/components/parameters/Order"
        - name: collapse
          in: query
          description: >
            Reserved: accepted and currently ignored by the server. SPEC §4.3
            lists it on this endpoint, but collapsing repeated events into
            groups is a presentation concern the UI performs client-side
            (PLAN P4-04's collapseEvents), and SPEC defines no server-side
            semantics for it. Documented as a no-op rather than silently
            accepted, so no client mistakes it for a filter that changes the
            result set.
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/Fields"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of timeline events, ordered by (ts, vendor_seq, seq).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineListResponse"
              examples:
                default:
                  value:
                    data:
                      - event_ref: "MTc2ODk2NzMyNDIyMTAwMDAwMDo5MTgyMzM"
                        seq: 918233
                        id: "0192abcd-0000-0000-0000-000000000001"
                        ts: "2026-08-11T09:12:04.221Z"
                        session_id: "3f7a3b1e-0000-0000-0000-000000000001"
                        prompt_id: "p_88f1"
                        kind: "tool.decision"
                        event_name: "tool_decision"
                        source: "otel_log"
                        vendor: "claude_code"
                        tool_name: "Edit"
                        tool_use_id: "toolu_01A"
                        decision: "reject"
                        decision_source: "user_reject"
                        tool_source: "builtin"
                        query_source: null
                        model: null
                        tokens: null
                        cost: null
                        duration_ms: null
                        success: null
                        error_type: null
                        agent_id: null
                        agent_type: null
                        permission_mode: "default"
                        file_path: "server/internal/store/postgres/store.go"
                        clock_skewed: false
                    page: { next_cursor: null, has_more: false }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions/{id}/turns:
    get:
      operationId: listSessionTurns
      tags: [sessions]
      summary: Turn list with per-turn aggregates
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of turns.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnsListResponse"
              examples:
                default:
                  value:
                    data:
                      - session_id: "3f7a3b1e-0000-0000-0000-000000000001"
                        prompt_id: "p_88f1"
                        turn_index: 3
                        started_at: "2026-08-11T09:11:00.000Z"
                        ended_at: "2026-08-11T09:12:30.000Z"
                        first_seen_at: "2026-08-11T09:11:00.100Z"
                        last_event_at: "2026-08-11T09:12:30.000Z"
                        duration_ms: 90000
                        status: "complete"
                        api_request_count: 2
                        tool_call_count: 5
                        tool_reject_count: 1
                        error_count: 0
                        input_tokens: 4123
                        output_tokens: 1894
                        cache_read_tokens: 12000
                        cache_creation_tokens: 800
                        cost_usd: 0.42
                        cost_estimated_usd: 0
                        models: ["claude-opus-5"]
                    page: { next_cursor: null, has_more: false }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions/{id}/tool-calls:
    get:
      operationId: listSessionToolCalls
      tags: [sessions]
      summary: Tool calls of one session
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/DecisionSource"
        - $ref: "#/components/parameters/Limit"
