  /api/v1/events/{ref}:
    get:
      operationId: getEvent
      tags: [events]
      summary: One event with full attrs (the detail drawer)
      parameters:
        - name: ref
          in: path
          required: true
          description: Opaque event_ref (base64url of ts+seq, SPEC §4.1). Not a lookup by id.
          schema:
            type: string
      responses:
        "200":
          description: The event, with attrs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventDetail"
              examples:
                default:
                  value:
                    event_ref: "MTc2ODk2NzMyNDIyMTAwMDAwMDo5MTgyMzM"
                    seq: 918233
                    id: "0192abcd-0000-0000-0000-000000000001"
                    ts: "2026-08-11T09:12:04.221Z"
                    session_id: "3f7a3b1e-0000-0000-0000-000000000001"
                    prompt_id: "p_88f1"
                    kind: "tool.decision"
                    event_name: "tool_decision"
                    source: "otel_log"
                    vendor: "claude_code"
                    tool_name: "Edit"
                    tool_use_id: "toolu_01A"
                    decision: "reject"
                    decision_source: "user_reject"
                    tool_source: "builtin"
                    query_source: null
                    model: null
                    tokens: null
                    cost: null
                    duration_ms: null
                    success: null
                    error_type: null
                    agent_id: null
                    agent_type: null
                    permission_mode: "default"
                    file_path: "server/internal/store/postgres/store.go"
                    clock_skewed: false
                    attrs: { "tool_decision.tool_use_id": "toolu_01A", "tool_decision.decision": "reject" }
        "400":
          description: Malformed event_ref.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                invalidEventRef:
                  value:
                    type: "urn:argus:error:invalid-event-ref"
                    title: "Bad Request"
                    status: 400
                    detail: "event_ref is not valid base64url of ts:seq"
                    instance: "/api/v1/events/not-a-ref"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/tool-calls:
    get:
      operationId: listToolCalls
      tags: [tool-calls]
      summary: Cross-session tool-call list — the decision-provenance drill-down
      parameters:
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/DecisionSource"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of tool calls across sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallsListResponse"
              examples:
                default:
                  $ref: "#/components/examples/ToolCallsListExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Scalar KPIs for a window
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Vendor"
        - $ref: "#/components/parameters/AnalyticsSource"
      responses:
        "200":
          description: Fleet-level KPIs for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
              examples:
                default:
                  value:
                    window: { from: "2026-08-04T00:00:00Z", to: "2026-08-11T00:00:00Z", bucket: "hour" }
                    sessions: 34
                    turns: 291
                    api_requests: 1044
                    api_errors: 7
                    tool_calls: 2210
                    tool_rejects: 91
                    reject_rate: 0.0412
                    tokens: { input: 1200000, output: 340000, cache_read: 81000000, cache_creation: 990000 }
                    cost: { usd: 71.44, reported_usd: 70.02, estimated_usd: 1.42, estimated_share: 0.0199 }
                    loc: { added: 8123, removed: 2044 }
                    active_seconds: 41220
                    source: "event"
                    metrics_only_projects: ["legacy-app"]
                    not_attributable: []
                modelFiltered:
                  summary: "?model=claude-sonnet-4-5 — non-model-attributable counters are null"
                  value:
                    window: { from: "2026-08-04T00:00:00Z", to: "2026-08-11T00:00:00Z", bucket: "hour" }
                    sessions: null
                    turns: null
                    api_requests: 512
                    api_errors: 3
                    tool_calls: null
                    tool_rejects: null
                    reject_rate: null
                    tokens: { input: 600000, output: 170000, cache_read: 40000000, cache_creation: 500000 }
                    cost: { usd: 35.2, reported_usd: 35.2, estimated_usd: 0, estimated_share: 0 }
                    loc: null
                    active_seconds: null
                    source: "event"
                    metrics_only_projects: []
                    not_attributable: ["sessions", "turns", "tool_calls", "tool_rejects", "reject_rate", "loc", "active_seconds"]
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/analytics/timeseries:
    get:
      operationId: getAnalyticsTimeseries
      tags: [analytics]
      summary: Bucketed series, dense and zero-filled
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TimeseriesMetric"
        - name: bucket
          in: query
          schema:
            type: string
            enum: [hour, day]
          description: Defaults to hour for windows <= 7 days, day beyond.
        - name: group_by
          in: query
          schema:
            type: string
            enum: [project, model, vendor, none]
            default: none
        - name: limit_series
          in: query
          schema:
            type: integer
            minimum: 1
            default: 8
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Vendor"
        - $ref: "#/components/parameters/AnalyticsSource"
      responses:
        "200":
          description: Dense, zero-filled bucketed series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
              examples:
                default:
                  value:
                    bucket: "hour"
                    buckets: ["2026-08-11T08:00:00Z", "2026-08-11T09:00:00Z"]
                    series:
                      - key: "argus"
                        values: [1.2, 0]
                    other: { values: [0.4, 0.1] }
        "400":
          description: Invalid metric/bucket, or a non-attributable metric under a model filter.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                notAttributable:
                  value:
                    type: "urn:argus:error:not-attributable"
                    title: "Bad Request"
                    status: 400
                    detail: "metric=sessions is not attributable under a model filter"
                    instance: "/api/v1/analytics/timeseries"
                invalidMetric:
                  value:
                    type: "urn:argus:error:invalid-parameter"
                    title: "Bad Request"
                    status: 400
                    detail: "metric must be one of cost, tokens, sessions, turns, api_requests, api_errors, tool_calls, tool_rejects, loc"
                    instance: "/api/v1/analytics/timeseries"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/analytics/breakdown:
    get:
      operationId: getAnalyticsBreakdown
      tags: [analytics]
      summary: Top-N by dimension
      parameters:
        - name: dimension
          in: query
          required: true
          schema:
            type: string
            enum: [model, project, tool, decision_source, query_source, error_type]
            description: >-
              The Argus-invented selector naming which raw dimension to
              break down by — not the vendor value itself, which stays an
              unconstrained string in the response rows.
        - name: metric
          in: query
          schema:
            type: string
            enum: [cost, calls, tokens]
            default: calls
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 20
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Model"
        - $ref: "#/components/parameters/Vendor"
        - $ref: "#/components/parameters/AnalyticsSource"
      responses:
        "200":
          description: Top-N rows by the requested dimension.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Breakdown"
              examples:
                default:
                  value:
                    dimension: "tool"
                    rows:
                      - { key: "Edit", value: 812, share: 0.37 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/analytics/decisions:
    get:
      operationId: getAnalyticsDecisions
      tags: [analytics]
      summary: Accept/reject x decision_source matrix
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Project"
      responses:
        "200":
          description: The decision-provenance matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionMatrix"
              examples:
                default:
                  value:
                    rows:
                      - tool_name: "Edit"
                        accept: 300
                        reject: 41
                        by_source: { config: 210, hook: 12, user_permanent: 40, user_temporary: 38, user_reject: 37, user_abort: 4 }
                        exact_share: 1.0
                        p50_wait_ms: 1900
                        p95_wait_ms: 22400
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/quality/unknown-kinds:
    get:
      operationId: getQualityUnknownKinds
      tags: [quality]
      summary: Grouped unmapped event_names, one raw sample each
      parameters:
        - name: since
          in: query
          schema:
            type: string
            default: "-24h"
            description: RFC 3339 or relative shorthand (e.g. -24h, -7d).
      responses:
        "200":
          description: Unmapped event_name groups within the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityUnknownKindsResponse"
              examples:
                default:
                  value:
                    rows:
                      - event_name: "some_new_event"
                        source: "otel_log"
                        count: 41
                        first_seen: "2026-08-10T10:00:00Z"
                        last_seen: "2026-08-11T09:00:00Z"
                        sample: { "raw.attr": "value" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/quality/hook-latency:
    get:
      operationId: getQualityHookLatency
      tags: [quality]
      summary: hook.execution_end percentiles by hook_event
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Hook latency percentiles per hook_event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QualityHookLatencyResponse"
              examples:
                default:
                  value:
                    rows:
                      - { hook_event: "PostToolUse", executions: 412, p50_ms: 9, p95_ms: 41, p99_ms: 120, errors: 0, cancelled: 0 }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/stream:
    get:
      operationId: streamAll
      tags: [stream]
      summary: SSE firehose across all sessions
      parameters:
        - $ref: "#/components/parameters/Kinds"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/Vendor"
        - $ref: "#/components/parameters/LastEventIDHeader"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: >-
            text/event-stream of StreamEvent frames (SPEC §5.1), filtered by
            kinds/project/vendor, plus session projection and stats frames.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
              examples:
                stats:
                  summary: "event: stats"
                  value:
                    events_per_sec: 42.1
                    active_sessions: 3
                    queue_depth: 0
                    ingest_lag_ms: 180
                    dropped_total: 0
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /v1/logs:
    post:
      operationId: ingestLogs
      tags: [ingest]
      summary: OTLP logs export
      description: >-
        Standard OTLP/HTTP log export
        (https://opentelemetry.io/docs/specs/otlp/#otlphttp). Body is the
        opaque OTLP ExportLogsServiceRequest, protobuf or JSON-encoded per
        Content-Type — described here as opaque object/binary rather than
        modeled field-by-field, since OTLP's own spec is the source of truth
        for that wire format.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              contentEncoding: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              otlpLogs:
                value: { resourceLogs: [] }
      responses:
        "200":
          description: Accepted (OTLP ExportLogsServiceResponse; empty JSON object on success).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                default:
                  value: {}
        "400":
          $ref: "#/components/responses/OTLPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/OTLPPayloadTooLarge"
        "415":
          $ref: "#/components/responses/OTLPUnsupportedMediaType"
        "503":
          $ref: "#/components/responses/OTLPUnavailable"

  /v1/metrics:
    post:
      operationId: ingestMetrics
      tags: [ingest]
      summary: OTLP metrics export
      description: >-
        Standard OTLP/HTTP metrics export; body is the opaque OTLP
        ExportMetricsServiceRequest (see /v1/logs's description).
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              contentEncoding: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              otlpMetrics:
                value: { resourceMetrics: [] }
      responses:
        "200":
          description: Accepted (OTLP ExportMetricsServiceResponse; empty JSON object on success).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                default:
                  value: {}
        "400":
          $ref: "#/components/responses/OTLPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/OTLPPayloadTooLarge"
        "415":
          $ref: "#/components/responses/OTLPUnsupportedMediaType"
        "503":
          $ref: "#/components/responses/OTLPUnavailable"

  /v1/traces:
    post:
      operationId: ingestTraces
      tags: [ingest]
      summary: OTLP traces export (accepted, not stored)
      description: >-
        Standard OTLP/HTTP traces export; body is the opaque OTLP
        ExportTraceServiceRequest (see /v1/logs's description). Argus has no
        trace model (SPEC §1) — accepted and discarded so a fully-configured
        OTel exporter never errors.
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              contentEncoding: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              otlpTraces:
                value: { resourceSpans: [] }
      responses:
        "200":
          description: Accepted (OTLP ExportTraceServiceResponse; empty JSON object).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                default:
                  value: {}
        "400":
          $ref: "#/components/responses/OTLPBadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/OTLPPayloadTooLarge"
        "415":
          $ref: "#/components/responses/OTLPUnsupportedMediaType"
        "503":
          $ref: "#/components/responses/OTLPUnavailable"

  /ingest/hook:
    post:
      operationId: ingestHook
      tags: [ingest]
      summary: Claude Code / vendor hooks webhook
      description: >-
        One raw hook payload per call (SPEC §1.1, §3.5). Shape varies by
        hook_event and vendor, so the body is documented as an opaque object
        rather than one fixed schema.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              postToolUse:
                value:
                  hook_event_name: "PostToolUse"
                  session_id: "3f7a3b1e-0000-0000-0000-000000000001"
                  tool_name: "Edit"
      responses:
        "202":
          description: >-
            Accepted for asynchronous ingestion (SPEC §3.5). `event` echoes
            the request's hook_event_name(s) back verbatim
            (server/internal/ingest/hooks/handler.go's writeAccepted) —
            comma-joined when the body is a batch-replay array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HookAccepted"
              examples:
                default:
                  value: { ok: true, event: "PostToolUse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          description: >-
            Hook payload exceeds ARGUS_INGEST_MAX_BODY_BYTES
            (server/internal/ingest/hooks/handler.go).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                default:
                  value:
                    type: "urn:argus:error:payload-too-large"
                    title: "Request Entity Too Large"
                    status: 413
                    detail: "hook payload exceeds the configured ARGUS_INGEST_MAX_BODY_BYTES limit"
                    instance: "/ingest/hook"
        "429":
          description: >-
            Ingest queue is full. Claude Code does not retry hooks, so the
            event(s) in this request are counted data loss
            (server/internal/ingest/hooks/handler.go).
          headers:
            Retry-After:
              description: Always "1" (seconds).
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                default:
                  value:
                    type: "urn:argus:error:queue-full"
                    title: "Too Many Requests"
                    status: 429
                    detail: "ingest queue is full; hooks are not retried by Claude Code, so this request's events were dropped"
                    instance: "/ingest/hook"

components:
  parameters:
    SessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: Default 50, max 500 (SPEC §4.1).
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Cursor:
      name: cursor
      in: query
      description: Opaque keyset cursor from a previous page's page.next_cursor.
      schema:
        type: string
    From:
      name: from
      in: query
      description: RFC 3339 timestamp or relative shorthand (-24h, -7d). SPEC §4.1.
      schema:
        type: string
    To:
      name: to
      in: query
      description: RFC 3339 timestamp or relative shorthand (-24h, -7d). SPEC §4.1.
      schema:
        type: string
    Project:
      name: project
      in: query
      description: Repeated params OR within the field (SPEC §4.1).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Model:
      name: model
      in: query
      description: Repeated params OR within the field (SPEC §4.1).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Vendor:
      name: vendor
      in: query
      description: Repeated params OR within the field (SPEC §4.1).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Tool:
      name: tool
      in: query
      description: Repeated params OR within the field (SPEC §4.1).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    DecisionSource:
      name: decision_source
      in: query
      description: Repeated params OR within the field (SPEC §4.1).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
    Kinds:
      name: kinds
      in: query
      description: Repeated params OR within the field (SPEC §4.1). Argus's own closed Kind taxonomy.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Kind"
      style: form
      explode: true
    PromptID:
      name: prompt_id
      in: query
      schema:
        type: string
    AgentID:
      name: agent_id
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    Fields:
      name: fields
      in: query
      description: slim (default, no attrs) or full.
      schema:
        type: string
        enum: [slim, full]
        default: slim
    After:
      name: after
      in: query
      description: Alternative to the Last-Event-ID header for SSE reconnect (SPEC §5.2).
      schema:
        type: string
    LastEventIDHeader:
      name: Last-Event-ID
      in: header
      description: SSE reconnect position, an opaque event_ref (SPEC §5.2).
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag from a previous response; a match returns 304 with an empty body.
      schema:
        type: string
    AnalyticsSource:
      name: source
      in: query
      description: >-
        Which source table to aggregate from. Argus-invented toggle, not
        vendor vocabulary: source='event' and source='metric' rows are never
        summed together (SPEC §2.4).
      schema:
        type: string
        enum: [event, metric]
        default: event

  responses:
    BadRequest:
      description: Malformed or out-of-range request parameter.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidCursor:
              value:
                type: "urn:argus:error:invalid-cursor"
                title: "Bad Request"
                status: 400
                detail: "cursor failed signature check"
                instance: "/api/v1/sessions"
            invalidParameter:
              value:
                type: "urn:argus:error:invalid-parameter"
                title: "Bad Request"
                status: 400
                detail: "from: not a valid RFC 3339 timestamp or relative shorthand: \"garbage\""
                instance: "/api/v1/sessions"
    Unauthorized:
      description: Missing or invalid bearer token (ARGUS_API_TOKEN configured).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: "urn:argus:error:unauthorized"
                title: "Unauthorized"
                status: 401
                detail: "missing or invalid bearer token"
                instance: "/api/v1/sessions"
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: "urn:argus:error:not-found"
                title: "Not Found"
                status: 404
                detail: "no such resource"
                instance: "/api/v1/sessions/does-not-exist"
    MethodNotAllowed:
      description: Method not allowed on this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            default:
              value:
                type: "urn:argus:error:method-not-allowed"
                title: "Method Not Allowed"
                status: 405
                detail: "method not allowed on this resource"
                instance: "/api/v1/sessions"

    OTLPBadRequest:
      description: >-
        Malformed envelope or one malformed element (google.rpc.Status,
        code=3 INVALID_ARGUMENT), answered in the request's negotiated wire
        format (server/internal/ingest/otlp/codec.go).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RpcStatus"
          examples:
            default:
              value: { code: 3, message: "invalid ExportLogsServiceRequest: unexpected EOF" }
        application/x-protobuf:
          schema:
            type: string
            contentEncoding: binary
    OTLPPayloadTooLarge:
      description: >-
        Request body exceeds ARGUS_INGEST_MAX_BODY_BYTES, raw or after gzip
        decompression (google.rpc.Status, code=8 RESOURCE_EXHAUSTED),
        answered in the request's negotiated wire format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RpcStatus"
          examples:
            default:
              value: { code: 8, message: "request body exceeds the configured limit" }
        application/x-protobuf:
          schema:
            type: string
            contentEncoding: binary
    OTLPUnsupportedMediaType:
      description: >-
        Missing or unsupported Content-Type (google.rpc.Status, code=3
        INVALID_ARGUMENT). Always application/json — unlike every other OTLP
        error response, this one never echoes the request's format, because
        the request's format was never successfully negotiated in the first
        place.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RpcStatus"
          examples:
            default:
              value: { code: 3, message: "unsupported content-type \"text/plain\" (want application/x-protobuf or application/json)" }
    OTLPUnavailable:
      description: >-
        Ingest queue is full (SPEC §3.4 backpressure; google.rpc.Status,
        code=14 UNAVAILABLE), answered in the request's negotiated wire
        format, with Retry-After: 1 so a compliant OTel SDK backs off and
        retries exactly once a second later.
      headers:
        Retry-After:
          description: Always "1" (seconds).
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RpcStatus"
          examples:
            default:
              value: { code: 14, message: "ingest queue is full" }
        application/x-protobuf:
          schema:
            type: string
            contentEncoding: binary

