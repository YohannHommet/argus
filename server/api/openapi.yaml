        "200":
          description: A page of tool calls.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolCallsListResponse"
              examples:
                default:
                  $ref: "#/components/examples/ToolCallsListExample"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions/{id}/subagents:
    get:
      operationId: getSessionSubagents
      tags: [sessions]
      summary: Subagent tree with cost attribution
      parameters:
        - $ref: "#/components/parameters/SessionID"
      responses:
        "200":
          description: The assembled subagent tree(s), depth-capped at 16.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubagentTree"
              examples:
                default:
                  value:
                    data:
                      - agent_id: "root"
                        parent_agent_id: null
                        agent_type: "main"
                        depth: 0
                        status: "running"
                        started_at: "2026-08-11T09:02:11.412Z"
                        ended_at: null
                        tool_call_count: 40
                        cost_usd: null
                        children:
                          - agent_id: "ag_7"
                            parent_agent_id: "root"
                            agent_type: "Explore"
                            depth: 1
                            status: "complete"
                            started_at: "2026-08-11T09:05:00.000Z"
                            ended_at: "2026-08-11T09:08:00.000Z"
                            spawn_tool_use_id: "toolu_9f"
                            tool_call_count: 12
                            cost_usd: null
                            children: []
                    cost_attribution:
                      by_query_source: { "": 3.9011, "sdk": 0.35 }
                      dominant_query_source: ""
                      other_query_source_usd: 0.35
                      per_node_available: false
                      note: "Claude Code does not emit per-agent cost; api_request carries query_source only."
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/sessions/{id}/stream:
    get:
      operationId: streamSession
      tags: [stream]
      summary: SSE stream of one session's events and projection updates
      parameters:
        - $ref: "#/components/parameters/SessionID"
        - $ref: "#/components/parameters/LastEventIDHeader"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: >-
            text/event-stream of StreamEvent frames (SPEC §5.1): event,
            session, stats, lag, reset, shutdown, plus `: heartbeat`
            comments. Frame type is carried by the SSE `event:` line, not a
            field in the JSON body.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamEvent"
              examples:
                event:
                  summary: "event: event"
                  value:
                    event_ref: "MTc2ODk2NzMyNDIyMTAwMDAwMDo5MTgyMzQ"
                    seq: 918234
                    id: "0192abcd-0000-0000-0000-000000000002"
                    ts: "2026-08-11T09:12:05.221Z"
                    session_id: "3f7a3b1e-0000-0000-0000-000000000001"
                    prompt_id: "p_88f1"
                    kind: "tool.result"
                    event_name: "tool_result"
                    source: "otel_log"
                    vendor: "claude_code"
                    tool_name: "Edit"
                    tool_use_id: "toolu_01A"
                    decision: null
                    decision_source: null
                    tool_source: "builtin"
                    query_source: null
                    model: null
                    tokens: null
                    cost: null
                    duration_ms: 180
                    success: true
                    error_type: null
                    agent_id: null
                    agent_type: null
                    permission_mode: "default"
                    file_path: "server/internal/store/postgres/store.go"
                    clock_skewed: false
                session:
                  summary: "event: session"
                  value:
                    id: "3f7a3b1e-0000-0000-0000-000000000001"
                    status: "active"
                    turn_count: 12
                    cost: { usd: 4.27, reported_usd: 4.27, estimated_usd: 0, estimated_share: 0, by_query_source: {}, dominant_query_source: "", other_query_source_usd: 0 }
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"

  /api/v1/events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Cross-session event search
      parameters:
        - $ref: "#/components/parameters/Kinds"
        - $ref: "#/components/parameters/Tool"
        - $ref: "#/components/parameters/DecisionSource"
