        - session.end
        - turn.start
        - turn.end
        - turn.prompt_expanded
        - llm.request
        - llm.error
        - llm.refusal
        - llm.request_body
        - llm.response_body
        - assistant.message
        - tool.pre
        - tool.decision
        - tool.permission_request
        - tool.result
        - tool.batch
        - subagent.start
        - subagent.stop
        - task.created
        - task.completed
        - permission.mode_changed
        - hook.registered
        - hook.execution_start
        - hook.execution_end
        - fs.file_changed
        - workspace.cwd_changed
        - workspace.directory_added
        - workspace.config_changed
        - workspace.instructions_loaded
        - workspace.worktree_created
        - workspace.worktree_removed
        - context.compact_start
        - context.compact_end
        - mcp.connection
        - mcp.elicitation
        - mcp.elicitation_result
        - agent.auth
        - agent.setup
        - agent.plugin
        - agent.internal_error
        - agent.notification
        - agent.idle
        - unknown

    EventSource:
      type: string
      description: Provenance pipeline (SPEC §1.3) — Argus-closed, one of the four permitted taxonomies.
