        page: { next_cursor: null, has_more: false }

  schemas:
    OKStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Argus-computed liveness state, not vendor vocabulary.
          enum: [ok]

    ReadyStatus:
      type: object
      required: [status, migrations]
      properties:
        status:
          type: string
          enum: [ok]
        migrations:
          type: string
          enum: [current]

    Problem:
      type: object
      description: >-
        RFC 9457 problem+json (SPEC §4.1). type is a stable
        urn:argus:error:<slug> from Argus's own error catalog (see
        server/internal/httpapi/problem.go); left as a plain string rather
        than enumerated here so a future URN never needs a spec-only
        migration to become valid.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
          description: >-
            chi's per-request id (m2 audit finding, server/internal/httpapi/problem.go).
            Present on every problem+json body so an operator can join a
            client-visible error back to the log line carrying the real error
            text; empty/absent where chi's RequestID middleware is not
            installed on the router in front of the handler (e.g. the ingest
            mount seams' own duplicated problem+json encoder, which predates
            this field and does not set it).
        errors:
          type: array
          items:
            type: object
            additionalProperties: true

    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean

    HookAccepted:
      type: object
      description: >-
        SPEC §3.5's 202 body (server/internal/ingest/hooks/handler.go's
        acceptedResponse). Argus is observe-only, so this body never carries
        a permission/decision verdict — only `ok` and the echoed event name.
      required: [ok, event]
      properties:
        ok:
          type: boolean
        event:
          type: string

    RpcStatus:
      type: object
      description: >-
        google.rpc.Status (https://cloud.google.com/apis/design/errors#error_model),
        the OTLP/HTTP error contract (SPEC §3.4). Hand-encoded in Go
        (server/internal/ingest/otlp/codec.go) but wire-verified
        byte-identical to the real generated type — `details` (field 3) is
        never populated, so it is not modeled here. Answered in
        application/x-protobuf or application/json matching the request's
        negotiated wire format, except the 415 response (see
        ingestLogs/ingestMetrics/ingestTraces), where negotiation itself
        failed and the body is always JSON.
      required: [code, message]
      properties:
        code:
          type: integer
          description: >-
            Canonical gRPC status code: 3 (INVALID_ARGUMENT) on 400/415, 8
            (RESOURCE_EXHAUSTED) on 413, 14 (UNAVAILABLE) on 503.
        message:
          type: string

    Kind:
      type: string
      description: Argus's own closed event taxonomy (SPEC §1.4) — one of the four closed vocabularies SPEC §0 permits.
      enum:
