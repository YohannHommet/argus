# Example docker-compose.override.yml.
#
# `docker compose` auto-loads a file named exactly `docker-compose.override.yml`
# next to docker-compose.yml. Copy this example there (that filename is
# gitignored) to customize a local stack without editing the committed
# compose files:
#
#   cp deploy/docker-compose.override.example.yml deploy/docker-compose.override.yml
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up -d
services:
  argusd:
    environment:
      ARGUS_INGEST_TOKEN: change-me-to-a-real-token
      ARGUS_RETENTION_RAW_DAYS: "90"
      ARGUS_RETENTION_SESSION_DAYS: "30"

  # One-shot traffic simulator (SPEC §3.8's `sim` subcommand, wired for real
  # since main.go). It POSTs to the already-running argusd container over
  # the compose network rather than touching Postgres itself, so it needs
  # --target pointed at argusd's in-network address, not the CLI's
  # http://localhost:8080 default (sim/cli.go), which is unreachable from
  # this container. See scripts/smoke.sh for the same pattern run via `exec`
  # instead of a separate container.
  sim:
    image: ghcr.io/yohannhommet/argus:latest
    depends_on:
      argusd:
        condition: service_healthy
    entrypoint: ["/argusd"]
    command: ["sim", "--mode=demo", "--target=http://argusd:8080"]
    restart: "no"
